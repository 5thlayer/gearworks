// Every piece of the build comes from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.4'
}

libworks {
    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range,
    // which runs to the next minor. The Works tab and the Gear Bench's ghosts come from it.
    runtime = '0.1.13'
    // Optional to players, and on the dev client only, so a Gear Bench can be powered from a creative
    // power pole. Gearworks names no Wireworks type: the pole reaches the bench through the energy
    // capability alone. Wireworks brings Groundworks, which it requires.
    upstream('wireworks') {
        optional = true
        range = '[0.6.7,)'
    }
}

// No official EMI for 26.1: this unofficial port is what the 5thlayer mods run with.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'
// Jade for 26.1.2. Built on NeoForge 26.1.2.76, so it runs on our .77.
def jade = 'maven.modrinth:jade:26.1.11+neoforge'

// Mods on the dev client that the published jar does not depend on. The game tests run on a source set
// of their own, with no code and the Module's dependencies but not these, so they prove the Module
// plays alone in vanilla.
sourceSets {
    solo
}

configurations {
    soloRuntimeOnly.extendsFrom implementation, runtimeOnly, libworksGametest
}

neoForge {
    runs {
        configureEach {
            // EMI's port still marks classes @OnlyIn, for which NeoForge stops each load at a warning screen.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        gameTestServer {
            sourceSet = sourceSets.solo
        }
    }

    addModdingDependenciesTo sourceSets.solo
}

repositories {
    // The EMI port, published on CurseForge only.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // On the dev client only: Gearworks names neither, so neither is compiled against.
    localRuntime emi
    localRuntime jade
}
