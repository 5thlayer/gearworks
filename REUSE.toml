version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".claude/settings.json",
    ".gitmodules",
    "**/*.mods.toml",
    "scripts/*.py",
    "scripts/*.sh",
    "plugin/src/main/resources/**/scripts/*",
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/main/resources/**/*.png",
    "**/src/main/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.json",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.nbt",
    "**/src/main/resources/**/*.nbt",
    "LICENSE",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# Malcolm Riley's unused textures: the Gear Bench's plating, copied unmodified, the workbench top it is
# built from, and the top scripts/build-textures.py builds from it (NOTICE).
[[annotations]]
path = [
    "data/art/*.png",
    "src/main/resources/assets/gearworks/textures/block/gear_bench/side.png",
    "src/main/resources/assets/gearworks/textures/block/gear_bench/bottom.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["src/main/resources/assets/gearworks/textures/block/gear_bench/top.png"]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Cover and icon for mod pages. Their backdrop is Minecraft's own item textures,
# which stay Mojang's; see LICENSES/LicenseRef-Mojang.txt.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Mojang AB", "2026 5thlayer"]
SPDX-License-Identifier = "LicenseRef-Mojang"

# The suits' icons are Futureazoo's flight chestplate, retinted per tier by scripts/draw-art.py, so
# they and the original keep its license; Gearworks is never monetized while it ships them (ADR 0004).
[[annotations]]
path = [
    "art/flight_chestplate.png",
    "src/main/resources/assets/gearworks/textures/item/*_gear.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Futureazoo", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"
